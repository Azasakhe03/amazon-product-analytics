name: Amazon Product Analytics

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run analytics
        run: python analyze_products.py

      - name: Display analytics report
        run: cat reports/analysis_report.md

      - name: Save analytics reports
        uses: actions/upload-artifact@v4
        with:
          name: amazon-analytics-reports
          path: reports/
